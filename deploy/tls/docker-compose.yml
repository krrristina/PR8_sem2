services:
  db:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=tasks
      - POSTGRES_PASSWORD=tasks
      - POSTGRES_DB=tasks
    ports:
      - "5432:5432"

  tasks:
    build:
      context: ../..
      dockerfile: services/tasks/Dockerfile
    container_name: tasks
    environment:
      - AUTH_GRPC_ADDR=host.docker.internal:50051
      - TASKS_PORT=8082
      - DB_DSN=postgres://tasks:tasks@db:5432/tasks?sslmode=disable
    ports:
      - "8082:8082"    # ← добавьте эту строку
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./cert.pem:/etc/nginx/tls/cert.pem
      - ./key.pem:/etc/nginx/tls/key.pem
    depends_on:
      - tasks